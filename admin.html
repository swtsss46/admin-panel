<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Админ-панель</title>
    <style>
        body {
            font-family: Arial;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 20px;
            color: white;
        }
        .card {
            background: white;
            color: black;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 15px;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 25px;
            width: 100%;
            cursor: pointer;
            font-size: 16px;
        }
        .stat {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>🌸 Админ-панель</h1>
    
    <div class="card">
        <h3>📊 Статистика</h3>
        <div class="stat" id="total">0</div>
        <p>всего записей</p>
    </div>
    
    <button onclick="refresh()">🔄 Обновить</button>
    
    <script>
        let tg = Telegram.WebApp;
        tg.ready();
        tg.expand();
        
        function refresh() {
            tg.sendData('get_stats');
        }
        
        // Функция для получения данных от бота
        window.receiveData = function(data) {
            try {
                let parsed = JSON.parse(data);
                document.getElementById('total').textContent = parsed.total_bookings || 0;
            } catch(e) {}
        };
    </script>
</body>
</html>
