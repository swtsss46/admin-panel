<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель | Стрижка Бот</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ffe6f0 0%, #ffd9e8 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            color: #ff6b9d;
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #ff8fb5;
            font-size: 14px;
        }
        
        .card {
            background: white;
            border-radius: 25px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 5px 20px rgba(255, 107, 157, 0.2);
            transition: transform 0.3s;
        }
        
        .card:hover {
            transform: translateY(-3px);
        }
        
        .card-title {
            font-size: 18px;
            font-weight: bold;
            color: #ff6b9d;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 15px;
        }
        
        .stat-item {
            background: #fff0f5;
            padding: 15px;
            border-radius: 15px;
            text-align: center;
        }
        
        .stat-number {
            font-size: 32px;
            font-weight: bold;
            color: #ff6b9d;
        }
        
        .stat-label {
            font-size: 12px;
            color: #ff8fb5;
            margin-top: 5px;
        }
        
        .booking-item {
            background: #fff0f5;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 10px;
        }
        
        .booking-date {
            font-weight: bold;
            color: #ff6b9d;
            font-size: 16px;
        }
        
        .booking-time {
            color: #ff8fb5;
            font-size: 14px;
        }
        
        .booking-user {
            color: #666;
            font-size: 13px;
            margin-top: 5px;
        }
        
        .btn {
            background: #ff6b9d;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: background 0.3s;
        }
        
        .btn:hover {
            background: #ff4d8a;
        }
        
        .btn-secondary {
            background: #ffb8d4;
            color: #ff6b9d;
        }
        
        .tab-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .tab {
            flex: 1;
            background: white;
            border: none;
            padding: 12px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .tab.active {
            background: #ff6b9d;
            color: white;
        }
        
        .hidden {
            display: none;
        }
        
        .footer {
            text-align: center;
            margin-top: 30px;
            color: #ff8fb5;
            font-size: 12px;
        }
        
        .loading {
            text-align: center;
            color: #ff8fb5;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌸 Админ-панель 🌸</h1>
            <p>Управление записями на стрижку</p>
        </div>
        
        <div class="tab-bar">
            <button class="tab active" onclick="switchTab('stats')">📊 Статистика</button>
            <button class="tab" onclick="switchTab('bookings')">📋 Записи</button>
            <button class="tab" onclick="switchTab('dates')">📅 По датам</button>
        </div>
        
        <div id="stats-tab">
            <div class="card">
                <div class="card-title">📊 Статистика ✨</div>
                <div class="stat-grid">
                    <div class="stat-item">
                        <div class="stat-number" id="total-bookings">0</div>
                        <div class="stat-label">Всего записей</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number" id="unique-clients">0</div>
                        <div class="stat-label">Клиентов</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number" id="upcoming">0</div>
                        <div class="stat-label">Предстоящих</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number" id="past">0</div>
                        <div class="stat-label">Прошедших</div>
                    </div>
                </div>
                <button class="btn btn-secondary" onclick="refreshData()">🔄 Обновить</button>
            </div>
        </div>
        
        <div id="bookings-tab" class="hidden">
            <div class="card">
                <div class="card-title">📋 Все записи</div>
                <div id="bookings-list" class="loading">✨ Загрузка... ✨</div>
                <button class="btn btn-secondary" onclick="refreshData()">🔄 Обновить</button>
            </div>
        </div>
        
        <div id="dates-tab" class="hidden">
            <div class="card">
                <div class="card-title">📅 Записи по датам</div>
                <div id="dates-list" class="loading">✨ Загрузка... ✨</div>
                <button class="btn btn-secondary" onclick="refreshData()">🔄 Обновить</button>
            </div>
        </div>
        
        <div class="footer">
            💕 Стрижка Бот | Всегда рады вам! 💕
        </div>
    </div>
    
    <script>
        let tg = Telegram.WebApp;
        
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById('stats-tab').classList.add('hidden');
            document.getElementById('bookings-tab').classList.add('hidden');
            document.getElementById('dates-tab').classList.add('hidden');
            
            if (tab === 'stats') {
                document.querySelectorAll('.tab')[0].classList.add('active');
                document.getElementById('stats-tab').classList.remove('hidden');
            } else if (tab === 'bookings') {
                document.querySelectorAll('.tab')[1].classList.add('active');
                document.getElementById('bookings-tab').classList.remove('hidden');
            } else if (tab === 'dates') {
                document.querySelectorAll('.tab')[2].classList.add('active');
                document.getElementById('dates-tab').classList.remove('hidden');
            }
        }
        
        function refreshData() {
            // Показываем загрузку
            document.getElementById('bookings-list').innerHTML = '✨ Загрузка... ✨';
            document.getElementById('dates-list').innerHTML = '✨ Загрузка... ✨';
            
            // Отправляем запрос боту
            tg.sendData('get_stats');
        }
        
        function updateDisplay(data) {
            try {
                // Если data строка, парсим её
                let parsedData = typeof data === 'string' ? JSON.parse(data) : data;
                
                console.log("Получены данные:", parsedData);
                
                // Обновляем статистику
                document.getElementById('total-bookings').textContent = parsedData.total_bookings || 0;
                document.getElementById('unique-clients').textContent = parsedData.unique_clients || 0;
                document.getElementById('upcoming').textContent = parsedData.upcoming || 0;
                document.getElementById('past').textContent = parsedData.past || 0;
                
                // Обновляем список записей
                if (parsedData.all_bookings && parsedData.all_bookings.length > 0) {
                    document.getElementById('bookings-list').innerHTML = parsedData.all_bookings.map(b => `
                        <div class="booking-item">
                            <div class="booking-date">📅 ${b.date}</div>
                            <div class="booking-time">⏰ ${b.time}</div>
                            <div class="booking-user">👤 ${b.username}</div>
                        </div>
                    `).join('');
                } else {
                    document.getElementById('bookings-list').innerHTML = '✨ Нет записей ✨';
                }
                
                // Обновляем записи по датам
                if (parsedData.bookings_by_date && Object.keys(parsedData.bookings_by_date).length > 0) {
                    document.getElementById('dates-list').innerHTML = Object.entries(parsedData.bookings_by_date).map(([date, bookings]) => `
                        <div class="booking-item">
                            <div class="booking-date">📅 ${date}</div>
                            ${bookings.map(b => `<div class="booking-time">⏰ ${b.time} - ${b.username}</div>`).join('')}
                        </div>
                    `).join('');
                } else {
                    document.getElementById('dates-list').innerHTML = '✨ Нет записей ✨';
                }
            } catch (e) {
                console.error("Ошибка обработки данных:", e);
                document.getElementById('bookings-list').innerHTML = '❌ Ошибка загрузки данных';
                document.getElementById('dates-list').innerHTML = '❌ Ошибка загрузки данных';
            }
        }
        
        // Инициализация WebApp
        tg.ready();
        tg.expand();
        
        // Ждём данные от бота
        Telegram.WebApp.onEvent('viewportChanged', function() {
            tg.expand();
        });
        
        // Получаем данные при открытии
        refreshData();
        
        // Функция, которую будет вызывать бот
        window.updateData = function(data) {
            updateDisplay(data);
        };
    </script>
</body>
</html>
