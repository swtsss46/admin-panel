<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Тест</title>
</head>
<body>
    <h1>Тест WebApp</h1>
    <button onclick="sendTest()">Отправить тест</button>
    <p id="result"></p>
    
    <script>
        // Ждём загрузки Telegram WebApp
        let tg = window.Telegram?.WebApp;
        
        if (!tg) {
            document.getElementById('result').innerHTML = '❌ Ошибка: не удалось подключиться к Telegram';
        } else {
            tg.ready();
            document.getElementById('result').innerHTML = '✅ Подключено к Telegram';
        }
        
        function sendTest() {
            if (!tg) {
                document.getElementById('result').innerHTML = '❌ Telegram не подключён';
                return;
            }
            
            document.getElementById('result').innerHTML = '📤 Отправляю: test_123';
            
            try {
                tg.sendData('test_123');
                document.getElementById('result').innerHTML = '✅ Отправлено: test_123';
            } catch(e) {
                document.getElementById('result').innerHTML = '❌ Ошибка: ' + e.message;
            }
        }
        
        // Слушаем ответ от бота
        tg?.onEvent('viewportChanged', function() {
            console.log('viewport changed');
        });
    </script>
</body>
</html>
