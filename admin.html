<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Тест</title>
</head>
<body>
    <h1>Тест WebApp</h1>
    <button onclick="sendTest()">Отправить тест</button>
    <p id="result"></p>
    
    <script>
        let tg = Telegram.WebApp;
        tg.ready();
        
        function sendTest() {
            document.getElementById('result').innerHTML = 'Отправлено: test_message';
            tg.sendData('test_message');
        }
        
        // Функция для получения ответа от бота
        window.receiveData = function(data) {
            document.getElementById('result').innerHTML = 'Получено: ' + data;
        };
    </script>
</body>
</html>
